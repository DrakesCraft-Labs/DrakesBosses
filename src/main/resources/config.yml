# DrakesBosses: arenas, combate, cobros y recompensas.
# Los kits, compras, rangos y sistemas generales pertenecen a Odysseia.

discord:
  enabled: true
  webhook-url: "REPLACE_ME"

integrations:
  diosesdrakes:
    boss-rewards:
      enabled: true

boss-balance:
  health-multiplier: 2.25
  damage-multiplier: 2.10
  movement-speed-multiplier: 1.60
  knockback-resistance: 0.95
  follow-range: 72.0
  skill-interval-ticks: 40
  announcement-radius: 64.0
  dialogue-radius: 48.0
  phase-shield-ticks: 32
  phase-rupture:
    radius: 8.0
    damage: 6.0
  combat-director:
    enabled: true
    target-range: 44.0
    cooldown-seconds: 9
    telegraph-ticks: 24
  mobility:
    enabled: true
    target-range: 56.0
    minimum-distance: 12.0
    flank-distance: 4.0
    cooldown-seconds: 7
  rebirth:
    bosses: [thor, ares, hades, zeus, odin, kratos, heimdall, hidra, cerbero, tifon, garou_cosmico]
    health-percent: 0.55
    invulnerability-seconds: 5
  adaptive-counters:
    enabled: true
    burst-window-seconds: 4
    counter-cooldown-seconds: 12
    normal:
      max-hit-health-fraction: 0.045
      max-burst-health-fraction: 0.20
    high-power:
      sharpness-threshold: 7
      max-hit-health-fraction: 0.025
      max-burst-health-fraction: 0.12
    full-infinity-armor:
      # Sólo detecta las cuatro piezas Tinker con INFINITY_SINGULARITY real en PDC.
      enabled: true
      cooldown-seconds: 5
      final-damage-threshold: 0.05
      minimum-health: 4.0
      minimum-health-loss: 2.0
      # Al anular por completo un golpe de jefe, el set recibe una respuesta seria.
      # Nunca mata: minimum-health conserva una oportunidad de escapar y curarse.
      health-loss-fraction: 0.50
      weakness-ticks: 80
      slowness-ticks: 40

boss-arena:
  # El plugin nunca crea el mundo ni cobra si esta ausente o no es valido.
  world-name: drakes_bosses
  allow-auto-create: false
  require-flat: false
  world-border-size: 4096
  entry-fees:
    default: 2500000
    circe: 2500000
    polifemo: 2500000
    dios_corrupto: 2500000
    thor: 2500000
    ares: 2500000
    poseidon: 2500000
    loki: 2500000
    zeus: 1250000
    hades: 1875000
    jax: 2500000
    heimdall: 3750000
    hidra: 3750000
    cerbero: 3750000
    artemisa: 3750000
    prometeo: 3750000
    coloso_end: 3750000
    ra: 3750000
    isis: 3750000
    anubis: 3750000
    set: 3750000
    odin: 5000000
    kratos: 5000000
    tifon: 7500000
    dragon: 12500000
    wither_storm: 25000000
    garou: 30000000
    free-permission: "drakesbosses.bosswarp.free"
  targeted-challenges:
    players:
      # Pasiente: el UUID evita perder el perfil si cambia de nick.
      "7ddf2641-14fb-4c1f-8499-aa5ff6c6b295":
        name: "Pasiente"
        health-multiplier: 1000000.0

natural-spawn:
  # Los bosses publicos pertenecen a arenas; no aparecen libres en survival.
  enabled: false
  interval-seconds: 1800
  chance: 0.25
  max-active: 2
  min-distance: 40
  max-distance: 80
  worlds:
    - world
    - world_nether
    - world_the_end
  bosses: []

boss-domains:
  # Efecto visual sin reemplazo de bloques y con limpieza al finalizar.
  enabled: true
  radius: 26
  height: 16
  duration-seconds: 900

bosses:
  jax:
    enabled: true
    health: 1350.0
    core-damage: 16.0
    target-range: 28.0
    charge-speed: 1.05
    impact-radius: 4.0
    impact-damage: 11.0

